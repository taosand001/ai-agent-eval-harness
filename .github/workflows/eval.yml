name: AI Agent Evals

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  eval:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [20.x, 22.x]
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      
      - name: Start mock server
        run: nohup npx tsx mock-site.ts > server.log 2>&1 &
        shell: bash
      
      - name: Wait for server
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:3000 > /dev/null; then
              echo "Server is ready"
              exit 0
            fi
            echo "Waiting for server... ($i/30)"
            sleep 1
          done
          echo "Server did not start in time"
          exit 1
        shell: bash
      
      - name: Run evaluation harness (10 trials)
        run: npm run eval:10
      
      - name: Server log
        if: failure()
        run: cat server.log || true
        shell: bash
      
      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.node-version }}
          path: traces/
          retention-days: 7
      
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ matrix.node-version }}
          path: evals/report.json
          retention-days: 30
      
      - name: Comment PR with results
        if: github.event_name == 'pull_request' && matrix.node-version == '20.x' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            try {
              const report = JSON.parse(fs.readFileSync('evals/report.json', 'utf-8'));
              
              const reliable = report.results.filter(r => r.kind === 'reliable').length;
              const flaky = report.results.filter(r => r.kind === 'flaky').length;
              const broken = report.results.filter(r => r.kind === 'broken').length;
              const passRate = Math.round((report.totalPassed / report.totalTrials) * 100);
              
              const comment = `
## 🧪 Agent Eval Results
- **Pass Rate:** ${passRate}%
- **Reliable:** ${reliable} cases ✅
- **Flaky:** ${flaky} cases ⚠️
- **Broken:** ${broken} cases ❌

${report.regressions.length > 0 ? `
### ⚠️ Regressions Detected
${report.regressions.map(r => `- ${r}`).join('\n')}
` : ''}

[View full report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
              `;
              
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            } catch (error) {
              console.log('Could not read report or comment:', error.message);
            }
